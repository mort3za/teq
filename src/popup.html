<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="popup.css" />
    <title>Teq... block'em!</title>
  </head>
  <body>
    <header>
      <h1 data-i18n="popup.title">Teq... block'em!</h1>
      <label class="switch-field" data-i18n-title="popup.autoCollectTitle" title="Auto-collect matches as you browse X">
        <span data-i18n="popup.autoCollect">Auto-collect</span>
        <span class="switch">
          <input id="autoCollect" type="checkbox" />
          <span class="slider"></span>
        </span>
      </label>
    </header>

    <div id="error" class="error" hidden></div>

    <label class="field">
      <span data-i18n="common.wordsLabel">Words / emoji to match (one per line)</span>
      <textarea id="words" rows="6" placeholder="crypto&#10;airdrop&#10;🚀"></textarea>
    </label>

    <div id="progress" class="progress" hidden>
      <span class="dot"></span>
      <span id="progressText"></span>
      <button id="pauseToggle" type="button" class="pause-toggle" aria-label="Pause">⏸</button>
    </div>

    <section class="collected">
      <div class="collected-head">
        <span id="collectedCount">0 collected</span>
        <a id="viewCollected" class="link" href="collected.html" target="_blank" rel="noreferrer" data-i18n="popup.viewAll">View all →</a>
        <button id="clearCollected" type="button" class="link" hidden data-i18n="common.clear">Clear</button>
      </div>
      <ul id="collectedList" class="collected-list"></ul>
      <p id="collectedEmpty" class="note" data-i18n="popup.nothingCollected">Nothing collected yet.</p>
      <button id="review" type="button" class="block-btn" disabled data-i18n="popup.reviewAndBlock">Review and block</button>
      <span id="runStatus" class="runStatus"></span>
    </section>

    <div class="stats">
      <strong id="count">0</strong> <span data-i18n="popup.blockedTotal">blocked total</span>
      <a id="viewAll" href="blocks.html" target="_blank" rel="noreferrer" data-i18n="popup.recentBlocks">Recent blocks →</a>
    </div>

    <p class="note" data-i18n="popup.note">
      Matches are collected as you browse X. Review the list, then block. Blocks are paced apart (configurable in
      Options) to stay under X's automation radar — keep the X tab open.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
