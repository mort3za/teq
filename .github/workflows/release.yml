# Runs only when a version tag (v1.2.3) is pushed. Normal pushes do not start it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actions/checkout replaces an annotated tag with a lightweight one.
      # Fetch the real tag again, so that the tag message is available.
      - run: git fetch --force origin "$GITHUB_REF:$GITHUB_REF"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # scripts/release.ts bumps both files, so the tag must match both.
      - name: Check tag matches package.json and manifest.json versions
        run: |
          for file in package.json manifest.json; do
            version="$(jq -r .version "$file")"
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match $file version $version"
              exit 1
            fi
          done

      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      # The unpacked zip keeps the manifest "key", so users who load it unpacked keep the same
      # extension ID (and their data) across updates. The Chrome Web Store does not accept a
      # "key" field, so the store zip has it removed.
      - name: Zip dist
        run: |
          (cd dist && zip -r "../teq-$GITHUB_REF_NAME.zip" .)
          jq 'del(.key)' dist/manifest.json > dist/manifest.tmp && mv dist/manifest.tmp dist/manifest.json
          (cd dist && zip -r "../teq-$GITHUB_REF_NAME-webstore.zip" .)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "teq-$GITHUB_REF_NAME.zip" "teq-$GITHUB_REF_NAME-webstore.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag \
            --verify-tag
