# Runs only when a version tag (v1.2.3) is pushed. Normal pushes do not start it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actions/checkout replaces an annotated tag with a lightweight one.
      # Fetch the real tag again, so that the tag message is available.
      - run: git fetch --force origin "$GITHUB_REF:$GITHUB_REF"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # scripts/release.ts bumps both files, so the tag must match both.
      - name: Check tag matches package.json and manifest.json versions
        run: |
          for file in package.json manifest.json; do
            version="$(jq -r .version "$file")"
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match $file version $version"
              exit 1
            fi
          done

      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      # The unpacked zip keeps the manifest "key", so users who load it unpacked keep the same
      # extension ID (and their data) across updates. The Chrome Web Store does not accept a
      # "key" field, so the store zip has it removed.
      - name: Zip dist
        run: |
          (cd dist && zip -r "../teq-$GITHUB_REF_NAME.zip" .)
          jq 'del(.key)' dist/manifest.json > dist/manifest.tmp && mv dist/manifest.tmp dist/manifest.json
          (cd dist && zip -r "../teq-$GITHUB_REF_NAME-webstore.zip" .)

      # The Chrome Web Store uses verified CRX uploads: the crx must be signed with the key whose
      # public key is in the dashboard. The private key is the CRX_KEY secret (PEM text). It is not
      # key.pem, which only sets the extension ID of unpacked installs. dist has no "key" now.
      # Chrome needs a display to pack, so it runs under xvfb. Chrome writes dist.crx next to dist.
      - name: Sign crx
        env:
          CRX_KEY: ${{ secrets.CRX_KEY }}
        run: |
          if [ -z "$CRX_KEY" ]; then
            echo "::error::Secret CRX_KEY is not set"
            exit 1
          fi
          key="$RUNNER_TEMP/crx-key.pem"
          printf '%s\n' "$CRX_KEY" > "$key"
          xvfb-run -a google-chrome --user-data-dir="$RUNNER_TEMP/chrome-profile" --no-message-box \
            --pack-extension="$PWD/dist" --pack-extension-key="$key"
          rm "$key"
          mv dist.crx "teq-$GITHUB_REF_NAME-webstore.crx"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "teq-$GITHUB_REF_NAME.zip" "teq-$GITHUB_REF_NAME-webstore.zip" "teq-$GITHUB_REF_NAME-webstore.crx" \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag \
            --verify-tag
