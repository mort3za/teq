name: Build & Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun test

      - name: Stamp version from tag into manifest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bun --eval "
            const m = await Bun.file('manifest.json').json();
            m.version = '$VERSION';
            await Bun.write('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "
          echo "manifest.json version -> $VERSION"

      - run: bun run build

      - name: Zip the extension
        run: cd dist && zip -r "../teq-${{ github.ref_name }}.zip" .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: teq-${{ github.ref_name }}.zip
          generate_release_notes: true
