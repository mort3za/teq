<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Persian red (#CC3333), lighter top-left to darker bottom-right -->
    <linearGradient id="bg" x1="10" y1="0" x2="118" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e04c3d"/>
      <stop offset="1" stop-color="#b02727"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="4" x2="0" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- rounded background + top gloss -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#gloss)"/>

  <g filter="url(#sh)">
    <!-- pistol, mirrored so the muzzle points left: the status dot
         (top-right) then covers the slide's rear, not the muzzle -->
    <g transform="translate(64 66) scale(-0.8 0.8) translate(-63 -70)">
      <g fill="#ffffff">
        <rect x="16" y="34" width="94" height="24" rx="5"/>
        <rect x="98" y="29" width="7" height="7" rx="1.5"/>
        <rect x="20" y="29" width="10" height="7" rx="1.5"/>
        <path d="M30 56h72v6a5 5 0 0 1-5 5H30z"/>
        <path d="M22 56h34l-5 50a6 6 0 0 1-6 5.5H23a6 6 0 0 1-6-6.5z"/>
      </g>
      <path d="M56 64v9a10 10 0 0 0 10 10h7a6 6 0 0 0 6-6V64" stroke="#ffffff" stroke-width="6" fill="none"/>
      <path d="M68 64l-3 9" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <!-- slide serrations + grip panel -->
      <path d="M26 40v12M33 40v12M40 40v12" stroke="#f4bfb8" stroke-width="3" stroke-linecap="round"/>
      <path d="M28 66h20l-3.6 36a4 4 0 0 1-4 3.6H28a4 4 0 0 1-4-4.4z" fill="#f4bfb8" opacity=".55"/>
    </g>

    <!-- muzzle flash -->
    <path d="M25 44l-9-9 1.5 7.5-7 1 6 4.5-7 5.5 10-1.5z" fill="#ffe066"/>
  </g>
</svg>
