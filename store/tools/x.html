<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Home / X</title>
    <!--
      A simple mock-up of the X home timeline for the store screenshots. serve.ts
      sends it for every https://x.com/ URL. It is not a real X page: it only has
      the markup that src/extract.ts reads (User-Name cell, profile link, tweetText
      with lang), so the real content script runs on it.
    -->
    <style>
      :root {
        --bg: #000;
        --line: #2f3336;
        --muted: #71767b;
        --skel: #202327;
        --blue: #1d9bf0;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scrollbar-width: none;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: #e7e9ea;
        font: 15px/1.35 -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      .page {
        display: grid;
        grid-template-columns: 1fr 600px 1fr;
        min-height: 100vh;
      }
      .nav {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        padding: 12px 24px;
      }
      .nav-inner {
        width: 140px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        padding-top: 20px;
      }
      .logo {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--skel);
      }
      .bar {
        height: 14px;
        border-radius: 7px;
        background: var(--skel);
      }
      .account {
        margin-top: auto;
        font-size: 0;
      }
      main {
        border-inline: 1px solid var(--line);
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--line);
      }
      .tab {
        flex: 1;
        text-align: center;
        padding: 16px 0 0;
        color: var(--muted);
        font-weight: 600;
      }
      .tab span {
        display: inline-block;
        padding-bottom: 12px;
      }
      .tab.on {
        color: #e7e9ea;
      }
      .tab.on span {
        border-bottom: 4px solid var(--blue);
        padding-bottom: 8px;
      }
      article {
        display: flex;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      .avatar {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
      }
      .body {
        flex: 1;
        min-width: 0;
      }
      [data-testid="User-Name"] a {
        color: inherit;
        text-decoration: none;
      }
      [data-testid="User-Name"] .name {
        font-weight: 700;
      }
      [data-testid="User-Name"] .handle,
      [data-testid="User-Name"] time {
        color: var(--muted);
      }
      [data-testid="tweetText"] {
        margin-top: 2px;
      }
      .actions {
        display: flex;
        gap: 48px;
        margin-top: 10px;
      }
      .actions i {
        width: 18px;
        height: 10px;
        border-radius: 5px;
        background: var(--skel);
      }
      aside {
        padding: 8px 24px;
      }
      .search {
        width: 250px;
        height: 42px;
        border-radius: 21px;
        background: var(--skel);
      }
      .box {
        width: 250px;
        height: 240px;
        margin-top: 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="nav">
        <div class="nav-inner">
          <div class="logo"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="account" data-testid="SideNav_AccountSwitcher_Button">Demo @demo_user</div>
        </div>
      </div>
      <main>
        <div class="tabs">
          <div class="tab on"><span>For you</span></div>
          <div class="tab"><span>Following</span></div>
        </div>
        <div id="timeline"></div>
      </main>
      <aside>
        <div class="search"></div>
        <div class="box"></div>
        <div class="box"></div>
      </aside>
    </div>

    <script>
      // [color, name, handle, lang, text]
      const tweets = [
        ["#f91880", "Free Airdrop 🚀🚀", "airdrop_daily_x7", "en", "🚀 FREE AIRDROP is live! Claim your tokens before midnight. DM me for the link 👇"],
        ["#7856ff", "Sara Ahmadi", "sara_reads", "en", "Finished my third book this month. Any recommendations for good science fiction?"],
        ["#00ba7c", "Crypto Signals 💎", "gem_signals_404", "en", "100x gem incoming 💎 Join my channel for early signals"],
        ["#ff7a00", "Dev Weekly", "devweekly", "en", "New issue is out: tips for faster builds, a guide to web components, and more."],
        ["#1d9bf0", "Moon Boy 🌕", "moonboy_9921", "en", "To the moon 🌕🌕 this one is going 50x easy"],
        ["#ffd400", "NFT Giveaway 🎁", "nft_drop_giver", "en", "Giveaway! Follow + RT + tag 3 friends to win a free NFT"],
        ["#f91880", "Tom Baker", "tbaker", "en", "The sunset at the lake today was amazing."],
        ["#00ba7c", "کریپتو سیگنال 🚀", "signal_fa_2024", "fa", "سیگنال رایگان امروز 🚀 لینک کانال در بیو"],
        ["#7856ff", "Lina Park", "linapark", "en", "Coffee first, then code ☕"],
      ];
      const timeline = document.getElementById("timeline");
      for (const [color, name, handle, lang, text] of tweets) {
        const a = document.createElement("article");
        a.innerHTML = `
          <div class="avatar" style="background:${color}"></div>
          <div class="body">
            <div data-testid="User-Name">
              <a href="/${handle}" class="name"></a>
              <a href="/${handle}" class="handle">@${handle}</a>
              · <a href="/${handle}/status/1"><time>2h</time></a>
            </div>
            <div data-testid="tweetText" lang="${lang}" dir="auto"></div>
            <div class="actions"><i></i><i></i><i></i><i></i></div>
          </div>`;
        a.querySelector(".name").textContent = name;
        a.querySelector('[data-testid="tweetText"]').textContent = text;
        timeline.append(a);
      }
    </script>
  </body>
</html>
