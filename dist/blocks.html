<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="blocks.css" />
    <title>Blocked accounts — Teq</title>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h2 class="brand">Teq</h2>
        <nav>
          <a class="nav-link" aria-current="page" href="blocks.html">Blocked <span class="nav-count" id="navCountBlocked"></span></a>
          <a class="nav-link" href="collected.html">Collected <span class="nav-count" id="navCount"></span></a>
          <a class="nav-link" href="options.html">Options</a>
        </nav>
      </aside>
      <main>
        <header>
          <div>
            <h1>Blocked accounts</h1>
            <p class="count"><strong id="count">0</strong> total</p>
          </div>
          <div class="actions">
            <button id="export" type="button" class="action">Export CSV</button>
            <button id="clear" type="button" class="clear">Clear list</button>
          </div>
        </header>

        <input id="search" type="search" placeholder="Search by username or name…" autocomplete="off" />

        <ul id="list" class="list"></ul>
        <p id="empty" class="empty" hidden>No blocked accounts yet.</p>

        <nav id="pager" class="pager" hidden>
          <button id="prev" type="button">← Prev</button>
          <span id="pageInfo"></span>
          <button id="next" type="button">Next →</button>
        </nav>
      </main>
    </div>

    <script src="blocks.js"></script>
  </body>
</html>
